events:

  # ─────────────────────────────────────────────────────────────────────────────
  # ARB OPENING — random 15% prompt after a fight win
  # Triggered from fight.js when at least one of armory/cannon deck is accessible.
  # Offers a quick-entry choice between available destinations.
  # ─────────────────────────────────────────────────────────────────────────────

  - id: arb-armory-opening
    name: "Cơ Hội — Lối Vào Ngẫu Nhiên"
    event_type: scene
    is_active: true

    message:
      title: "Cơ hội!"
      text: |
        Ngay khi vừa đánh bại kẻ địch, bạn chợt nhận ra mình đang ở ngay gần cầu thang dẫn xuống.

        Có lẽ đây là cơ hội của bạn. Và cũng là thách thức. Sẽ không ai hỗ trợ được bạn bên dưới.
      message_type: normal

    option:
      - id: enter-armory
        text: "Xuống Kho Vũ Khí"
        next: arb-armory-enter
        display_order: 0

      - id: enter-cannon
        text: "Xuống Boong Pháo"
        next: arb-cannon-enter
        display_order: 1

      - id: skip
        text: "Tập trung vào trận chiến."
        display_order: 2

  # ── Outcome: player chooses to enter ────────────────────────────────────────

  - id: arb-armory-enter
    name: "Kho Vũ Khí — Vào Trong"
    event_type: scene
    is_active: true

    message:
      title: "Kho Vũ Khí"
      text: |
        Bạn lao qua cánh cửa. Ánh sáng mờ — kệ vũ khí xếp dọc hai bên tường.
      message_type: normal

    action:
      - type: move
        location: 11
        silent: true

  # ── Outcome: player skips — no event, chain ends ──────────────────────────────

  - id: arb-cannon-enter
    name: "Boong Pháo — Vào Trong"
    event_type: scene
    is_active: true

    message:
      title: "Boong Pháo"
      text: |
        Bạn lách qua cầu thang. Mùi thuốc súng còn lưu lại — khẩu đại bác xếp thành hàng hai bên.
      message_type: normal

    action:
      - type: move
        location: 10
        silent: true

  # ── Standalone boss encounter events ──────────────────────────────────────
  # Each is an independent entry point; not part of the below-deck entry flow.

  - id: arb-boss-boatswain-intro
    name: "Sự Kiện Boss — Thủy Thủ Trưởng"
    event_type: scene
    is_active: true

    message:
      title: "Kẻ chỉ huy"
      text: |
        Ngay khi vừa hạ được kẻ địch, bạn thấy một thủy thủ trông có vẻ đứng tuổi, bộ dạng dày dặn kinh nghiệm đang cầm một cái roi. Là đốc quân của kẻ địch, nếu hạ hắn sẽ làm giảm được sĩ khí của kẻ địch.
      message_type: normal

    option:
      - id: fight-boatswain
        text: "Cơ hội chỉ có một"
        next: arb-boss-boatswain-combat
        display_order: 0

      - id: spare-boatswain
        text: "Thôiiii"
        display_order: 1

  - id: arb-boss-boatswain-combat
    name: "Chiến Đấu Boss — Thủy Thủ Trưởng"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: "boss"
      enemy: "enemy_boatswain"
      on_victory: arb-boss-boatswain-victory
      on_defeat: arb-boss-boatswain-defeat

  - id: arb-boss-boatswain-victory
    name: "Boss Bị Hạ — Thủy Thủ Trưởng"
    event_type: scene
    is_active: true

    message:
      title: "Đốc quân Gục Ngã"
      text: |
        Sợi dây buông thõng và hàng ngũ boong trên tan vỡ. Kẻ địch trở nên hoảng loạn khi mất đi người chỉ huy của họ, và bạn có thể cảm thấy tinh thần của họ giảm sút.
      message_type: normal

    action:
      - type: narrate
        channel: battle
        title: "Boss Defeated"
        text: "${player_name} has defeated the Boatswain!"
        color: 0x27ae60
      - type: flag
        flag_name: global.arb_boss_boatswain_defeated
        flag_value: 1
        flag_operation: set
        flag_type: global
        silent: true
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 10
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-boss-boatswain-defeat
    name: "Boss Thắng — Thủy Thủ Trưởng"
    event_type: scene
    is_active: true

    message:
      title: "Bị Đẩy Lui"
      text: |
        Bạn đã bị hạ gục.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-boss-master-at-arms-intro
    name: "Sự Kiện Boss — Chỉ Huy Vũ Trang"
    event_type: scene
    is_active: true

    message:
      title: "Chiến binh lão luyện"
      text: |
        Trong đám đông đang chiến đấu, là một chiến binh cao lớn mặc giáp nặng, cầm một cây rìu chiến. Là chỉ huy vũ trang của kẻ địch. Mỗi lần hắn vung rìu, hai ba thủy thủ Gateland bị đánh bại. Có lẽ bạn nên thách đấu hắn.
      message_type: normal

    option:
      - id: fight-master-at-arms
        text: "Thách đấu."
        next: arb-boss-master-at-arms-combat
        display_order: 0

      - id: spare-master-at-arms
        text: "Không phải hôm nay."
        display_order: 1

  - id: arb-boss-master-at-arms-combat
    name: "Chiến Đấu Boss — Chỉ Huy Vũ Trang"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: "boss"
      enemy: "master_at_arms"
      on_victory: arb-boss-master-at-arms-victory
      on_defeat: arb-boss-master-at-arms-defeat

  - id: arb-boss-master-at-arms-victory
    name: "Boss Bị Hạ — Chỉ Huy Vũ Trang"
    event_type: scene
    is_active: true

    message:
      title: "Thách đấu thắng lợi"
      text: |
        Sau một trận chiến khốc liệt, bạn đã hạ gục được một đối thủ xứng tầm.
      message_type: normal

    action:
      - type: narrate
        channel: battle
        title: "Boss Defeated"
        text: "${player_name} has defeated the Master at Arms!"
        color: 0x27ae60
      - type: flag
        flag_name: global.arb_boss_master_at_arms_defeated
        flag_value: 1
        flag_operation: set
        flag_type: global
        silent: true
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 10
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-boss-master-at-arms-defeat
    name: "Boss Thắng — Chỉ Huy Vũ Trang"
    event_type: scene
    is_active: true

    message:
      title: "Bị đánh bại"
      text: |
        Điều cuối cùng bạn nghe thấy là tiếng cười ngạo nghễ của hắn.

        "Cũng giỏi lắm, nhưng chưa tài đâu."
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-boss-first-mate-intro
    name: "Sự Kiện Boss — Thuyền Phó"
    event_type: scene
    is_active: true

    message:
      title: "Chỉ huy cao cấp"
      text: |
        Đứng ở trên mũi tàu, nhìn bao quát trận địa là một người đàn ông trẻ tuổi, mặc giáp nhẹ nhưng rõ ràng có địa vị. Đây hẳn là một chỉ huy cao cấp.
      message_type: normal

    option:
      - id: fight-first-mate
        text: "Chiến đấu với Thuyền Phó"
        next: arb-boss-first-mate-combat
        display_order: 0

      - id: spare-first-mate
        text: "Rút lui"
        display_order: 1

  - id: arb-boss-first-mate-combat
    name: "Chiến Đấu Boss — Thuyền Phó"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: "boss"
      enemy: "enemy_first_mate"
      on_victory: arb-boss-first-mate-victory
      on_defeat: arb-boss-first-mate-defeat

  - id: arb-boss-first-mate-victory
    name: "Boss Bị Hạ — Thuyền Phó"
    event_type: scene
    is_active: true

    message:
      title: "Thuyền Phó Gục Ngã"
      text: |
        Bạn lao lên và hạ gục được thuyền phó. Hắn ngã xuống trong sự bàng hoàng.
      message_type: normal

    action:
      - type: narrate
        channel: battle
        title: "Boss Defeated"
        text: "${player_name} has defeated the First Mate!"
        color: 0x27ae60
      - type: flag
        flag_name: global.arb_boss_first_mate_defeated
        flag_value: 1
        flag_operation: set
        flag_type: global
        silent: true
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 10
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-boss-first-mate-defeat
    name: "Boss Thắng — Thuyền Phó"
    event_type: scene
    is_active: true

    message:
      title: "Không Theo Kịp"
      text: |
        Mặc dù trận chiến chưa ngã ngũ, nhưng có vẻ thủy thủ đoàn của kẻ địch sắp sửa bao vây. Bạn buộc phải rút lui.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  # ── Random deck encounters ─────────────────────────────────────────────────
  # Repeatable. Added to the main-deck 15% post-win pool alongside boss intros.
  # Interceding starts a fight; ignoring costs -2 morale.

  # ── Encounter A: Wounded ally ──────────────────────────────────────────────

  - id: arb-renc-wounded-ally-intro
    name: "Gặp Gỡ Ngẫu Nhiên — Đồng Đội Bị Thương"
    event_type: scene
    is_active: true

    message:
      title: "Người Ngã Xuống"
      text: |
        Một thủy thủ HMS Divine đang bị dồn vào thành tàu, một tay bị liệt,
        cố gắng chống đỡ một tên thủy thủ dày dạn kinh nghiệm bằng cây
        thương giáp chiến gãy. Anh ta sẽ không cầm cự được bao lâu nữa.
      message_type: normal

    option:
      - id: renc-a-intercede
        text: "Kéo kẻ địch ra khỏi anh ta."
        next: arb-renc-wounded-ally-combat
        display_order: 0

      - id: renc-a-ignore
        text: "Tiếp tục tiến — còn nhiều việc quan trọng hơn."
        next: arb-renc-wounded-ally-ignore
        display_order: 1

  - id: arb-renc-wounded-ally-combat
    name: "Gặp Gỡ Ngậu Nhiên A — Chiến Đấu"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: normal
      enemy: veteran_sailor
      on_victory: arb-renc-wounded-ally-win
      on_defeat: arb-renc-wounded-ally-lose

  - id: arb-renc-wounded-ally-win
    name: "Gặp Gỡ Ngậu Nhiên A — Chiến Thắng"
    event_type: scene
    is_active: true
    next: arb-renc-wounded-ally-tip

    message:
      title: "Đã Cứu"
      text: |
        Tên thủy thủ dày dạn ngã xuống. Người bị thương tựa vào thành
        tàu lấy lại hơi thở. Anh ta gật đầu về phía một khoảng trống trong hàng ngũ kẻ địch.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-wounded-ally-tip
    name: "Gặp Gỡ Ngậu Nhiên A — Tiếp Nối"
    event_type: scene
    is_active: true

    message:
      title: "Vị Trí Bỏ Trống"
      text: |
        Một khoảng hở ngắn. Sẽ không kéo dài lâu.
      message_type: normal

    option:
      - id: renc-a-tip-push
        text: "Chiếm lấy vị trí đó."
        next: arb-renc-wounded-ally-tip-combat
        display_order: 0

      - id: renc-a-tip-skip
        text: "Cứu được đồng đội là đủ — rút lui."
        display_order: 1

  - id: arb-renc-wounded-ally-tip-combat
    name: "Gặp Gỡ Ngậu Nhiên A — Chiến Đấu Tiếp Nối"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: normal
      enemy: man_at_arms
      on_victory: arb-renc-wounded-ally-tip-win
      on_defeat: arb-renc-wounded-ally-tip-lose

  - id: arb-renc-wounded-ally-tip-win
    name: "Gặp Gỡ Ngậu Nhiên A — Chiến Thắng Tiếp Nối"
    event_type: scene
    is_active: true

    message:
      title: "Chiếm Được Vị Trí"
      text: |
        Tên lính vũ trang không ngờ có mối đe dọa thứ hai. Vị trí đó
        là của bạn chừng nào phòng tuyến còn giữ được.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 2
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-wounded-ally-tip-lose
    name: "Gặp Gỡ Ngậu Nhiên A — Thất Bại Tiếp Nối"
    event_type: scene
    is_active: true

    message:
      title: "Bị Đánh Lui"
      text: |
        Hắn chuẩn bị kỹ hơn so với người thủy thủ nói. Bạn rút lui
        trước khi chịu thương tích nặng hơn một vết bầm.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-wounded-ally-lose
    name: "Gặp Gỡ Ngậu Nhiên A — Thất Bại"
    event_type: scene
    is_active: true

    message:
      title: "Bị Đẩy Lui"
      text: |
        Tên thủy thủ dày dạn mạnh hơn vẻ ngoài. Bạn cắt liên lạc
        trước khi tình huống tệ hơn. Người bị thương biến mất trong hỗn loạn.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-wounded-ally-ignore
    name: "Gặp Gỡ Ngậu Nhiên A — Bỏ Qua"
    event_type: scene
    is_active: true

    message:
      title: "Bỏ Lại Phía Sau"
      text: |
        Bạn tiếp tục bước qua. Phía sau, tiếng động ngắn ngủi của một
        cuộc chiến thua cuộc chấm dứt. Phòng tuyến cảm thấy mỏng manh hơn một chút.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -2
        flag_operation: add
        flag_type: global
        silent: true

  # ── Encounter B: Grapple cutter ───────────────────────────────────────────

  - id: arb-renc-breach-intro
    name: "Gặp Gỡ Ngẫu Nhiên — Xạ Thủ Nỏ"
    event_type: scene
    is_active: true

    message:
      title: "Trong Tầm Ngắm"
      text: |
        Một tên xạ thủ nỏ đang ngắm thẳng vào lưng một thủy thủ HMS Divine
        đang giao chiến phía trước. Hắn sắp bắn.
      message_type: normal

    option:
      - id: renc-b-intercede
        text: "Xông vào hắn."
        next: arb-renc-breach-combat
        display_order: 0

      - id: renc-b-ignore
        text: "Không đủ thời gian — tiếp tục tiến."
        next: arb-renc-breach-ignore
        display_order: 1

  - id: arb-renc-breach-combat
    name: "Gặp Gỡ Ngẫu Nhiên B — Chiến Đấu"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: normal
      enemy: crossbowman
      on_victory: arb-renc-breach-win
      on_defeat: arb-renc-breach-lose

  - id: arb-renc-breach-win
    name: "Gặp Gỡ Ngẫu Nhiên B — Chiến Thắng"
    event_type: scene
    is_active: true

    message:
      title: "Phát Nỏ Bị Chặn"
      text: |
        Hắn ngã xuống trước khi buông dây nỏ. Người thủy thủ phía trước
        liếc qua vai — thấy tên xạ thủ đổ gục, gật đầu một cái, rồi quay
        lại đòn đang đối mặt.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 2
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-breach-lose
    name: "Gặp Gỡ Ngẫu Nhiên B — Thất Bại"
    event_type: scene
    is_active: true

    message:
      title: "Bị Đánh Bật"
      text: |
        Báng nỏ phang vào bạn trước khi bạn kịp tiếp cận. Bạn ngã xuống — loạng
        choạng rời khỏi trận. Đằng sau, tiếng dây nỏ bật. Người thủy thủ phía
        trước không còn ai che.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -3
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-breach-ignore
    name: "Gặp Gỡ Ngẫu Nhiên B — Bỏ Qua"
    event_type: scene
    is_active: true

    message:
      title: "Một Phát Nỏ"
      text: |
        Bạn tiếp tục tiến. Phía sau, tiếng dây nỏ bật. Một người gục xuống.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: -2
        flag_operation: add
        flag_type: global
        silent: true

  # ── Encounter C: Pinned gunner ─────────────────────────────────────────────

  - id: arb-renc-pinned-gunner-intro
    name: "Gặp Gỡ Ngậu Nhiên — Xạ Thủ Bị Cô Lập"
    event_type: scene
    is_active: true

    message:
      title: "Bị Ghim Chặt"
      text: |
        Một xạ thủ HMS Divine đang co ro sau đống hàng hóa bị lật đổ,
        không thể di chuyển. Một tên lính vũ trang đang dần tiến quanh
        chiếc bình phong của hắn.
      message_type: normal

    option:
      - id: renc-c-intercede
        text: "Kéo hắn ra khỏi xạ thủ."
        next: arb-renc-pinned-gunner-combat
        display_order: 0

      - id: renc-c-ignore
        text: "Không thể dừng lại vì từng cuộc đụng độ nhỏ."
        next: arb-renc-pinned-gunner-ignore
        display_order: 1

  - id: arb-renc-pinned-gunner-combat
    name: "Gặp Gỡ Ngậu Nhiên C — Chiến Đấu"
    event_type: combat
    silent: true
    is_active: true

    combat:
      combat_type: normal
      enemy: man_at_arms
      on_victory: arb-renc-pinned-gunner-win
      on_defeat: arb-renc-pinned-gunner-lose

  - id: arb-renc-pinned-gunner-win
    name: "Gặp Gỡ Ngậu Nhiên C — Chiến Thắng"
    event_type: scene
    is_active: true

    message:
      title: "Xạ Thủ Được Giải Thoát"
      text: |
        Tên lính vũ trang ngã xuống. Xạ thủ bò ra khỏi bình phong và
        trở lại vị trí mà không nói một lời — khẩu đại bác thay
        anh ta nói lời cảm ơn.
      message_type: normal

    action:
      - type: flag
        flag_name: global.hms_divine_morale
        flag_value: 2
        flag_operation: add
        flag_type: global
        silent: true

  - id: arb-renc-pinned-gunner-lose
    name: "Gặp Gỡ Ngậu Nhiên C — Thất Bại"
    event_type: scene
