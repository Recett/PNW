enemies:

  # ─── COMMON ─────────────────────────────────────────────────────

  - id: sailor
    name: Sailor
    unknown_name: Enemy Sailor
    description: >
      A crewman armed with a cutlass and a belaying pin. Canvas jack
      treated with pitch. Built to hold a line, not win a duel.
    level: 3
    enemy_type: humanoid
    status: active
    stat:
      health: 35
      defense: 1
      defense_percent: 0
      crit_resistance: 5
      evade: 12
      speed: 12
    attack:
      - id: cutlass_swing
        name: Cutlass Swing
        base_damage: 14
        accuracy: 10
        critical_chance: 5
        cooldown: 100
    reward:
      exp: 50

  - id: cutthroat
    name: Cutthroat
    unknown_name: Fast Knife
    description: >
      Unarmored, fast, and entirely uninterested in a fair fight.
      High evasion, low staying power. Dangerous when ignored.
    level: 3
    enemy_type: humanoid
