# ─── BOSS ───────────────────────────────────────────────────────

  - id: enemy_boatswain
    name: Boatswain
    unknown_name: The Enforcer
    description: >
      Armed with a tarred starter rope weighted at the end. No armor,
      no interest in defense. He uses speed and reach to keep a
      defender off-balance and never lets them set their footing.
    level: 6
    enemy_type: humanoid
    status: active
    tag:
      - unique_per_voyage
    stat:
      health: 120
      defense: 4
      defense_percent: 0
      crit_resistance: 5
      evade: 16
      speed: 16
    attack:
      - id: knotted_rope_lash
        name: Discipline
        base_damage: 18
        accuracy: 18
        critical_chance: 15
        cooldown: 100
    reward:
      exp: 200

  - id: master_at_arms
    name: Master-at-Arms
    unknown_name: Elite Marine
    description: >
      The ship's primary combat instructor. Heavy brigandine, pollaxe,
