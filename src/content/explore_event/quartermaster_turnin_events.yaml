events:

  # -----------------------------------------------
  # QUARTERMASTER YORK — FOOD TURN-IN
  # Player talks to York and selects which food item
  # to turn in. Each item grants gold + food stock.
  #
  # Gold rates: dynamically read from each item's `value` field (contentStore).
  #   rat_meat  → +4 food stock per unit
  #   herring   → +6 food stock per unit
  #   mackerel  → +6 food stock per unit
  #   crab_meat → +8 food stock per unit
  #   shark_meat→ +8 food stock per unit
  #
  # Entry point: york-turnin-menu
  # -----------------------------------------------

  - id: york-turnin-menu
    name: "York — Turn-In Menu"
    event_type: encounter

    message:
      text: "York liếc qua những gì ${2p} đang mang. \"Có gì cho kho không? ${npc_1p} lấy hết — giá công bằng.\""

    option:
      - id: york-turnin-rat
        text: "Giao thịt chuột"
        next: york-turnin-qty-rat
        display_order: 0
      - id: york-turnin-herring
        text: "Giao cá trích"
        next: york-turnin-qty-herring
        display_order: 1
      - id: york-turnin-mackerel
        text: "Giao cá thu"
        next: york-turnin-qty-mackerel
        display_order: 2
      - id: york-turnin-crab
        text: "Giao thịt cua"
        next: york-turnin-qty-crab
        display_order: 3
      - id: york-turnin-shark
        text: "Giao thịt cá mập"
        next: york-turnin-qty-shark
        display_order: 4
      - id: york-turnin-leave
        text: "Không có gì lúc này"
        next: york-turnin-farewell
        display_order: 5

  # ── QUANTITY PROMPTS ───────────────────────────

  - id: york-turnin-qty-rat
    name: "York — Quantity (Rat Meat)"
    event_type: encounter
    next: york-turnin-check-rat
    action:
      - type: variable
        variable_name: qty
        source_type: input
        is_numeric: true
        input_label: "Bao nhiêu thịt chuột?"
        input_placeholder: "Nhập số lượng (vd. 1, 5, 10)"
        silent: true

  - id: york-turnin-qty-herring
    name: "York — Quantity (Herring)"
    event_type: encounter
    next: york-turnin-check-herring
    action:
      - type: variable
        variable_name: qty
        source_type: input
        is_numeric: true
        input_label: "Bao nhiêu cá trích?"
        input_placeholder: "Nhập số lượng (vd. 1, 5, 10)"
        silent: true

  - id: york-turnin-qty-mackerel
    name: "York — Quantity (Mackerel)"
    event_type: encounter
    next: york-turnin-check-mackerel
    action:
      - type: variable
        variable_name: qty
        source_type: input
        is_numeric: true
        input_label: "Bao nhiêu cá thu?"
        input_placeholder: "Nhập số lượng (vd. 1, 5, 10)"
        silent: true

  - id: york-turnin-qty-crab
    name: "York — Quantity (Crab Meat)"
    event_type: encounter
    next: york-turnin-check-crab
    action:
      - type: variable
        variable_name: qty
        source_type: input
        is_numeric: true
        input_label: "Bao nhiêu thịt cua?"
        input_placeholder: "Nhập số lượng (vd. 1, 5, 10)"
        silent: true

  - id: york-turnin-qty-shark
    name: "York — Quantity (Shark Meat)"
    event_type: encounter
    next: york-turnin-check-shark
    action:
      - type: variable
        variable_name: qty
        source_type: input
        is_numeric: true
        input_label: "Bao nhiêu thịt cá mập?"
        input_placeholder: "Nhập số lượng (vd. 1, 5, 10)"
        silent: true

  # ── RAT MEAT ───────────────────────────────────

  - id: york-turnin-check-rat
    name: "York — Check rat meat"
    event_type: encounter

    check:
      - name: has-rat-meat
        type: item
        item_data:
          - item_id: rat_meat
            required_quantity: "${qty}"
        silent: true
        on_success: york-turnin-take-rat
        on_failure: york-turnin-no-item

  - id: york-turnin-take-rat
    name: "York — Take rat meat"
    event_type: encounter

    message:
      text: "York nhíu mũi lại. \"Thịt chuột à. Thôi, vào nồi hết.\" Ông ta ném tiền cho ${2p}."

    action:
      - type: sell
        item: rat_meat
        quantity: "${qty}"
      - type: flag
        flag_name: global.food_stock
        flag_value: "${qty} * 4"
        flag_operation: add
        flag_type: global
        silent: false
        custom_message: "Lương thực +${qty * 4}."

  # ── HERRING ────────────────────────────────────

  - id: york-turnin-check-herring
    name: "York — Check herring"
    event_type: encounter

    check:
      - name: has-herring
        type: item
        item_data:
          - item_id: herring
            required_quantity: "${qty}"
        silent: true
        on_success: york-turnin-take-herring
        on_failure: york-turnin-no-item

  - id: york-turnin-take-herring
    name: "York — Take herring"
    event_type: encounter

    message:
      text: "\"Cá trích. Tốt.\" York ghi vào sổ cái rồi đếm tiền ra mà không cần nhìn lên."

    action:
      - type: sell
        item: herring
        quantity: "${qty}"
      - type: flag
        flag_name: global.food_stock
        flag_value: "${qty} * 6"
        flag_operation: add
        flag_type: global
        silent: false
        custom_message: "Lương thực +${qty * 6}."

  # ── MACKEREL ───────────────────────────────────

  - id: york-turnin-check-mackerel
    name: "York — Check mackerel"
    event_type: encounter

    check:
      - name: has-mackerel
        type: item
        item_data:
          - item_id: mackerel
            required_quantity: "${qty}"
        silent: true
        on_success: york-turnin-take-mackerel
        on_failure: york-turnin-no-item

  - id: york-turnin-take-mackerel
    name: "York — Take mackerel"
    event_type: encounter

    message:
      text: "York cầm con cá thu lên, bóp thử một cái. \"Ổn đó.\""

    action:
      - type: sell
        item: mackerel
        quantity: "${qty}"
      - type: flag
        flag_name: global.food_stock
        flag_value: "${qty} * 6"
        flag_operation: add
        flag_type: global
        silent: false
        custom_message: "Lương thực +${qty * 6}."

  # ── CRAB MEAT ──────────────────────────────────

  - id: york-turnin-check-crab
    name: "York — Check crab meat"
    event_type: encounter

    check:
      - name: has-crab-meat
        type: item
        item_data:
          - item_id: crab_meat
            required_quantity: "${qty}"
        silent: true
        on_success: york-turnin-take-crab
        on_failure: york-turnin-no-item

  - id: york-turnin-take-crab
    name: "York — Take crab meat"
    event_type: encounter

    message:
      text: "York nhướng mày. \"Cua? Từ đâu ra?\""

    action:
      - type: sell
        item: crab_meat
        quantity: "${qty}"
      - type: flag
        flag_name: global.food_stock
        flag_value: "${qty} * 8"
        flag_operation: add
        flag_type: global
        silent: false
        custom_message: "Lương thực +${qty * 8}."

  # ── SHARK MEAT ─────────────────────────────────

  - id: york-turnin-check-shark
    name: "York — Check shark meat"
    event_type: encounter

    check:
      - name: has-shark-meat
        type: item
        item_data:
          - item_id: shark_meat
            required_quantity: "${qty}"
        silent: true
        on_success: york-turnin-take-shark
        on_failure: york-turnin-no-item

  - id: york-turnin-take-shark
    name: "York — Take shark meat"
    event_type: encounter

    message:
      text: "York nhìn chằm chằm vào thịt cá mập một lúc. Rồi nhìn ${2p}. \"Đừng có thành thói quen suýt chết.\" Tiền lần này rộng rãi hơn."

    action:
      - type: sell
        item: shark_meat
        quantity: "${qty}"
      - type: flag
        flag_name: global.food_stock
        flag_value: "${qty} * 8"
        flag_operation: add
        flag_type: global
        silent: false
        custom_message: "Lương thực +${qty * 8}."

  # ── SHARED OUTCOMES ────────────────────────────

  - id: york-turnin-no-item
    name: "York — Item not found"
    event_type: encounter
    next: york-turnin-menu

    message:
      text: "York kiểm tra túi của ${2p} rồi lắc đầu. \"${2p} không có nhiều thế đâu.\""

  - id: york-turnin-farewell
    name: "York — Farewell"
    event_type: encounter

    message:
      text: "\"Thôi được. Lúc nào ${2p} có gì thì quay lại.\""
